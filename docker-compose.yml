# Local runs of each service, against files in ./data instead of the cloud.
#
#   docker compose run --rm ingest probe              # day-1 checks against the live API
#   docker compose run --rm ingest rankings --backfill
#   docker compose run --rm ingest daily
#   docker compose run --rm transform build           # dbt build into ./data/warehouse.duckdb
#   docker compose run --rm transform test            # dbt tests only
#   docker compose up                                 # daily ingest, then dbt build, in order

services:
  ingest:
    build: ./services/ingest
    env_file: .env
    environment:
      LOCAL_DATA_DIR: /data/raw
    volumes:
      - ./data:/data

  transform:
    build: ./services/transform
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      DBT_TARGET: local
      RAW_DATA_DIR: /data/raw
      DUCKDB_PATH: /data/warehouse.duckdb
    volumes:
      - ./data:/data
