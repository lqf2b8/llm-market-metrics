# Local runs of each service, against files in ./data instead of the cloud.
# Raw data lives in ./data (a folder you can open); the DuckDB warehouse lives in a Docker
# volume, because DuckDB needs file locking that Windows/macOS folder sharing lacks.
#
#   docker compose run --rm ingest probe              # day-1 checks against the live API
#   docker compose run --rm ingest rankings --backfill
#   docker compose run --rm ingest daily
#   docker compose run --rm transform build           # dbt build into the warehouse volume
#   docker compose run --rm transform test            # dbt tests only
#   docker compose up                                 # ingest, dbt build, then serve the API
#   open http://localhost:8080/docs                   # metrics API, interactive docs
#   docker compose run --rm memo                      # draft this week's memo (API must be up)

services:
  ingest:
    build: ./services/ingest
    env_file: .env
    environment:
      LOCAL_DATA_DIR: /data/raw
    volumes:
      - ./data:/data

  transform:
    build: ./services/transform
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      DBT_TARGET: local
      RAW_DATA_DIR: /data/raw
      DUCKDB_PATH: /warehouse/warehouse.duckdb
    volumes:
      - ./data:/data:ro
      - warehouse:/warehouse

  metrics-api:
    build: ./services/metrics_api
    depends_on:
      transform:
        condition: service_completed_successfully
    environment:
      WAREHOUSE: duckdb
      DUCKDB_PATH: /warehouse/warehouse.duckdb
    ports:
      - "8080:8080"
    volumes:
      - warehouse:/warehouse:ro

  memo:
    build: ./services/memo
    profiles: ["memo"]          # on demand only: needs ANTHROPIC_API_KEY in .env
    env_file: .env
    environment:
      METRICS_API_URL: http://metrics-api:8080
      MEMO_DIR: /memos
    volumes:
      - ./memos:/memos

volumes:
  warehouse:
