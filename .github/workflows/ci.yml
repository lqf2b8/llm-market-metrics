name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t ingest:ci .
      - name: Run the image
        run: docker run --rm ingest:ci --help

  transform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transform
    env:
      DBT_PROFILES_DIR: .
      RAW_DATA_DIR: ci_fixtures/raw
      DUCKDB_PATH: ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: dbt build on DuckDB with fixture data
        run: dbt build --target local
      - name: Validate the semantic layer against the warehouse
        run: mf validate-configs
      - name: Metrics views match MetricFlow
        run: python scripts/check_metrics_parity.py --duckdb-path ci.duckdb
      - name: Parse for BigQuery (no credentials needed)
        run: dbt parse --target bigquery
      - name: Build image
        run: docker build -t transform:ci .
      - name: Run the image as it runs in compose (non-root, fixture data)
        run: |
          docker run --rm \
            -e DBT_TARGET=local -e RAW_DATA_DIR=/fixtures -e DUCKDB_PATH=/warehouse/ci.duckdb \
            -v "$PWD/ci_fixtures/raw:/fixtures:ro" \
            transform:ci build

  metrics-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a warehouse from fixtures for the contract tests
        working-directory: services/transform
        env:
          DBT_PROFILES_DIR: .
          RAW_DATA_DIR: ci_fixtures/raw
          DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
        run: |
          pip install -r requirements.txt
          dbt build --target local
      - name: Lint and test
        working-directory: services/metrics_api
        env:
          METRICS_DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
      - name: Build image
        run: docker build -t metrics-api:ci services/metrics_api
      - name: Run the image and call it
        run: |
          docker run -d --name api -p 8080:8080 -e WAREHOUSE=duckdb -e DUCKDB_PATH=/w/ci.duckdb \
            -v "${{ github.workspace }}/ci.duckdb:/w/ci.duckdb:ro" metrics-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/kpis | head -c 300
          docker logs api

  memo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t memo:ci .
      - name: Run the image
        run: docker run --rm memo:ci --help
