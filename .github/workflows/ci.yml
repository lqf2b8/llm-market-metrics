name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t ingest:ci .
      - name: Run the image
        run: docker run --rm ingest:ci --help

  transform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transform
    env:
      DBT_PROFILES_DIR: .
      RAW_DATA_DIR: ci_fixtures/raw
      DUCKDB_PATH: ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: dbt build on DuckDB with fixture data (first pass; forecasts are tested in metrics-api)
        run: dbt build --target local --exclude tag:post_analysis
      - name: Validate the semantic layer against the warehouse
        run: mf validate-configs
      - name: Metrics views match MetricFlow
        run: python scripts/check_metrics_parity.py --duckdb-path ci.duckdb
      - name: Parse for BigQuery (no credentials needed)
        run: dbt parse --target bigquery
      - name: Build image
        run: docker build -t transform:ci .
      - name: Run the image as it runs in compose (non-root, fixture data)
        run: |
          docker run --rm \
            -e DBT_TARGET=local -e RAW_DATA_DIR=/fixtures -e DUCKDB_PATH=/warehouse/ci.duckdb \
            -v "$PWD/ci_fixtures/raw:/fixtures:ro" \
            transform:ci

  analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t analysis:ci .

  metrics-api:
    # The whole local pipeline on 26 weeks of synthetic data: dbt first pass, the analysis
    # service (as its container), dbt second pass, then the API's contract tests.
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      RAW_DATA_DIR: ${{ github.workspace }}/fixtures26
      DUCKDB_PATH: ${{ github.workspace }}/warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate 26 weeks of fixture data and run dbt's first pass
        working-directory: services/transform
        run: |
          pip install -r requirements.txt
          python ci_fixtures/generate.py --days 182 --out "$RAW_DATA_DIR"
          mkdir -p "$(dirname "$DUCKDB_PATH")"
          dbt build --target local --exclude tag:post_analysis
      - name: Run the analysis image as it runs in compose (non-root)
        run: |
          docker build -t analysis:ci services/analysis
          chmod 777 "$(dirname "$DUCKDB_PATH")" && chmod 666 "$DUCKDB_PATH"
          docker run --rm -e WAREHOUSE=duckdb -e DUCKDB_PATH=/warehouse/ci.duckdb \
            -v "$(dirname "$DUCKDB_PATH"):/warehouse" analysis:ci
      - name: dbt second pass (forecast models and their tests)
        working-directory: services/transform
        run: dbt build --target local --select tag:post_analysis
      - name: Dashboard renders every view from the warehouse
        working-directory: services/dashboard
        env:
          DASHBOARD_DUCKDB_PATH: ${{ env.DUCKDB_PATH }}
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Lint and test
        working-directory: services/metrics_api
        env:
          METRICS_DUCKDB_PATH: ${{ env.DUCKDB_PATH }}
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
      - name: Build image
        run: docker build -t metrics-api:ci services/metrics_api
      - name: Run the image and call it
        run: |
          docker run -d --name api -p 8080:8080 -e WAREHOUSE=duckdb -e DUCKDB_PATH=/w/ci.duckdb \
            -v "$DUCKDB_PATH:/w/ci.duckdb:ro" metrics-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/kpis | head -c 300
          curl -sf localhost:8080/forecast | head -c 300
          docker logs api

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t dashboard:ci .
      - name: Run the image and load the page (no warehouse, so it must show the error, not crash)
        run: |
          docker run -d --name dash -p 8050:8050 -e WAREHOUSE=duckdb -e DUCKDB_PATH=/nope.duckdb dashboard:ci
          for i in $(seq 1 30); do curl -sf localhost:8050/ >/dev/null && break; sleep 1; done
          # Pages are rendered by the router callback, so ask it for each route.
          route() {
            curl -sf -H 'Content-Type: application/json' localhost:8050/_dash-update-component \
              -d '{"output":"..nav.children...page.children..","outputs":[{"id":"nav","property":"children"},{"id":"page","property":"children"}],"inputs":[{"id":"url","property":"pathname","value":"'"$1"'"}],"changedPropIds":["url.pathname"],"state":[]}'
          }
          route / | grep -q "Could not read the metrics views"
          route /datastudio | grep -q "datastudio.google.com/embed/reporting"
          docker logs dash

  memo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image
        run: docker build -t memo:ci .
      - name: Run the image
        run: docker run --rm memo:ci --help
