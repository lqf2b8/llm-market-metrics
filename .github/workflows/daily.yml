name: daily

# Runs the pipeline on Cloud Run in order: ingest, dbt, forecasts, dbt's second pass.
# On Tuesdays it also drafts the weekly memo and opens a pull request with it for review;
# a memo is merged only after an analyst edits it. To draft memos for past weeks, run it by
# hand with "memo_weeks" (the pipeline step is then skipped).

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily, after OpenRouter's day closes
  workflow_dispatch:
    inputs:
      memo:
        description: Also draft the weekly memo
        type: boolean
        default: false
      memo_weeks:
        description: Draft memos for these past weeks instead (Mondays, space-separated, e.g. 2026-10-05 2026-10-12)
        type: string
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write        # push the memo branch
  pull-requests: write   # open the memo PR
  id-token: write        # keyless sign-in to Google

env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  pipeline:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: github-deployer@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run the pipeline
        if: inputs.memo_weeks == ''
        run: |
          for job in ingest transform analysis transform-post; do
            echo "::group::$job"
            gcloud run jobs execute "$job" --region "$REGION" --wait --quiet
            echo "::endgroup::"
          done

      - name: Is it memo day?
        id: when
        env:
          MEMO: ${{ inputs.memo }}
          WEEKS: ${{ inputs.memo_weeks }}
        run: |
          if [ "$MEMO" = "true" ] || [ -n "$WEEKS" ] \
              || [ "$(date -u +%u)" = "2" ]; then
            echo "memo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the weekly memo
        id: draft
        if: steps.when.outputs.memo == 'true'
        env:
          WEEKS: ${{ inputs.memo_weeks }}
        run: |
          # A draft that fails the number check is still saved (as <week>.REJECTED.md, with the
          # reasons at the bottom), so keep going and open the PR; fail the run at the end.
          failed=""
          if [ -z "$WEEKS" ]; then
            gcloud run jobs execute memo --region "$REGION" --wait --quiet || failed="latest week"
          else
            for week in $WEEKS; do
              if ! [[ "$week" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::Not a date: $week"; exit 1
              fi
              echo "::group::memo $week"
              gcloud run jobs execute memo --region "$REGION" --wait --quiet --args="--week,$week" \
                || failed="$failed $week"
              echo "::endgroup::"
            done
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::warning::Memo job failed for:$failed. If the number check rejected a draft, the PR has <week>.REJECTED.md with the reasons; otherwise see the job's logs in Cloud Run."
          fi

      - name: Open a pull request with the draft
        if: always() && steps.when.outputs.memo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copy only drafts the repository does not have yet: memos already merged were edited
          # by an analyst and must not be overwritten.
          gcloud storage cp --recursive --no-clobber "gs://$PROJECT-memos/*" memos/
          if [ -z "$(git status --porcelain memos)" ]; then
            echo "No new memo drafts."; exit 0
          fi
          branch="memo/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add memos
          git commit -m "Weekly memo draft"
          git push --force origin "$branch"
          body="Drafted by Claude from the metrics API and checked number by number against the facts file. Edit before merging; see memos/README.md. A file named *.REJECTED.md failed the number check and lists why at the bottom."
          gh pr view "$branch" >/dev/null 2>&1 || \
            gh pr create --head "$branch" --title "Weekly memo draft $(date -u +%Y-%m-%d)" --body "$body"

      - name: Fail if any memo job failed
        if: steps.draft.outputs.failed != ''
        env:
          FAILED: ${{ steps.draft.outputs.failed }}
        run: |
          echo "::error::Memo job failed for:$FAILED"
          exit 1
