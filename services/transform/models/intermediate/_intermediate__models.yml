version: 2

models:
  - name: int_model_prices_history
    description: >
      Type-2 list-price history, one row per price_key per unchanged-price period, derived
      from the daily model-list snapshots. Join usage on
      usage_date >= valid_from and (valid_to is null or usage_date < valid_to).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_key, valid_from]
      - unique_combination_of_columns:
          # At most one current price per key.
          arguments:
            combination_of_columns: [price_key]
          config:
            where: "is_current"
      - expression_is_true:
          arguments:
            expression: "valid_to > valid_from"
          config:
            where: "valid_to is not null"
      - expression_is_true:
          arguments:
            expression: "last_observed_date >= valid_from"
    columns:
      - name: price_key
        data_tests: [not_null]
      - name: valid_from
        description: First snapshot date with this price (inclusive).
        data_tests: [not_null]
      - name: valid_to
        description: Date the next price took effect (exclusive); null for the current price.
      - name: is_first_window
        description: >
          Earliest price observed for this key. Usage dated before valid_from may use it,
          flagged downstream as priced by backfill.

  - name: int_usage_priced
    description: >
      Daily tokens per model with the list price in effect that day and the basis the price
      came from. Implied spend = tokens x blended price, where the blend assumes
      var('prompt_token_share') of tokens are prompt tokens.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [usage_date, model_permaslug]
      - expression_is_true:
          # Every priced row has a spend; every unpriced row has none.
          arguments:
            expression: "(implied_spend_usd is not null) = is_priced"
      - expression_is_true:
          arguments:
            expression: "implied_spend_usd = 0"
          config:
            where: "is_zero_priced"
    columns:
      - name: pricing_basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [other_bucket, free_variant, stealth_preview, listed, listed_backfilled,
                         retired_list_price, unpriced]
      - name: implied_spend_usd
        description: Tokens x blended list price, USD. An index of spend, not anyone's revenue.
        data_tests:
          - expression_is_true:
              arguments:
                expression: "implied_spend_usd >= 0"
              config:
                where: "implied_spend_usd is not null"
